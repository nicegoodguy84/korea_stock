name: Daily Stock Screener

on:
  schedule:
    - cron: '0 7 * * 1-5' # 한국시간 매일 오후 4시 자동 실행 (월~금)
  workflow_dispatch: # 수동 실행 버튼

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 한글 폰트 설치 (차트 한글 깨짐 방지)
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-nanum

    - name: 필요 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 분석 코드 실행
      run: |
        python main.py

    - name: 결과물 웹용 변환
      run: |
        latest_html=$(ls -t 정통_융합_추세돌파_리포트_*.html | head -n 1)
        cp "$latest_html" index.html

    - name: 웹사이트에 업로드
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        keep_files: false
